name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./...
      - name: vet other OS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GOOS=windows go vet ./...; else GOOS=linux go vet ./...; fi
      - if: hashFiles('cmd/**') != ''
        run: go build ./cmd/...
