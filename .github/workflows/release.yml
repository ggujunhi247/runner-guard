name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: reject non-release tags
        run: |
          # Hosts only parse vMAJOR.MINOR.PATCH; anything else as "latest" would break every update.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27" # build with a supported Go: stdlib security fixes ship in released binaries
      - run: go vet ./... && go test ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X github.com/ggujunhi247/runner-guard/internal/update.Version=${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o runner-guard_linux_amd64 ./cmd/runner-guard
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o runner-guard_windows_amd64.exe ./cmd/runner-guard
          ./runner-guard_linux_amd64 selftest
          test "$(./runner-guard_linux_amd64 version)" = "$GITHUB_REF_NAME"
          sha256sum runner-guard_* > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            runner-guard_*
            checksums.txt

  windows-check:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - shell: bash
        run: |
          ./runner-guard_windows_amd64.exe selftest
          test "$(./runner-guard_windows_amd64.exe version | tr -d '\r')" = "$GITHUB_REF_NAME"

  publish:
    needs: [build, windows-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" runner-guard_* checksums.txt --generate-notes

  # The real thing: the previous release's binary updates itself to this one.
  update-smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: previous release binary updates itself
        run: |
          prev=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 2 --json tagName --jq '.[1].tagName // ""')
          if [ -z "$prev" ]; then echo "first release; nothing to update from"; exit 0; fi
          if [ "$RUNNER_OS" = "Windows" ]; then asset=runner-guard_windows_amd64.exe; sudo=""; else asset=runner-guard_linux_amd64; sudo=sudo; fi
          mkdir old && cd old
          gh release download "$prev" -R "$GITHUB_REPOSITORY" -p "$asset"
          chmod +x "$asset"
          echo "before: $(./$asset version)"
          $sudo ./$asset update
          after=$(./$asset version | tr -d '\r')
          echo "after: $after"
          test "$after" = "$GITHUB_REF_NAME"
