name: release
on:
  push:
    tags: ["v*"]
# Read-only by default; only publish may write the release.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: reject non-release tags
        run: |
          # Hosts only parse vMAJOR.MINOR.PATCH; anything else as "latest" would break every update.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27" # build with a supported Go: stdlib security fixes ship in released binaries
      - run: go vet ./... && go test ./...
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X github.com/ggujunhi247/runner-guard/internal/update.Version=${GITHUB_REF_NAME}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o runner-guard_linux_amd64 ./cmd/runner-guard
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o runner-guard_windows_amd64.exe ./cmd/runner-guard
          ./runner-guard_linux_amd64 selftest
          test "$(./runner-guard_linux_amd64 version)" = "$GITHUB_REF_NAME"
          # checksums.txt (signed later) covers every published file, the helper
          # script and guide included. scripts/sign-release.sh rebuilds this exact
          # file from the tag with the same command and signs only if it matches.
          mkdir dist
          cp runner-guard_linux_amd64 runner-guard_windows_amd64.exe rg-windows.ps1 dist/
          cp docs/windows.md dist/runner-guard-windows-guide.md
          (cd dist && sha256sum runner-guard_linux_amd64 runner-guard_windows_amd64.exe rg-windows.ps1 runner-guard-windows-guide.md > checksums.txt && cat checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  windows-check:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - shell: bash
        run: |
          ./runner-guard_windows_amd64.exe selftest
          test "$(./runner-guard_windows_amd64.exe version | tr -d '\r')" = "$GITHUB_REF_NAME"

  publish:
    needs: [build, windows-check]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        # The Windows helper and its guide ride along; the updater only takes runner-guard_<os>_<arch>.
        run: |
          # A draft: hosts only accept a release signed with the key kept off GitHub.
          # The maintainer runs scripts/sign-release.sh, which checks, signs and publishes;
          # release-check.yml then tests the published release.
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft runner-guard_* checksums.txt rg-windows.ps1 runner-guard-windows-guide.md --generate-notes
