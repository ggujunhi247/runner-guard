# Turns on auto-merge for PRs that may merge themselves. GitHub then merges
# (rebase, keeping each commit's author) once the checks required on main pass.
# - the owner's PRs from this repo, unless draft or labelled "no-automerge"
# - Dependabot action updates, except major versions (left for a person)
name: automerge
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.html_url }}
    steps:
      - id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: leave major updates to a person
        if: steps.meta.outputs.update-type == 'version-update:semver-major' && github.event.action == 'opened'
        run: gh pr comment "$PR" --body "Major version update - review the release notes and merge by hand."
      - name: enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR" --auto --rebase
