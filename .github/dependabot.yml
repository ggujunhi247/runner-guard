# Actions are pinned to commit SHAs; this keeps the pins current.
# Non-major updates merge themselves once CI passes (workflows/automerge.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
