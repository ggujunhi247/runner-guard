# Actions are pinned to commit SHAs; this keeps the pins current.
# Non-major updates merge themselves once CI passes (workflows/automerge.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A hijacked action release is usually caught within days; wait before
    # proposing it, since non-major updates merge themselves.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
